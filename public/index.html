<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fantasy Football Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Fantasy Football Dashboard</h1>
    <form id="league-form">
      <label>League ID <input type="number" id="league-id" value="1676746"></label>
      <label>Year <input type="number" id="year" value="2026"></label>
      <button type="submit">Load</button>
    </form>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="standings">Standings</button>
    <button class="tab-btn" data-tab="matchups">Matchups</button>
    <button class="tab-btn" data-tab="rosters">Rosters</button>
  </nav>

  <main>
    <div id="error" class="error hidden"></div>

    <section id="tab-standings" class="tab-panel active">
      <table>
        <thead>
          <tr>
            <th>#</th><th>Team</th><th>W</th><th>L</th><th>T</th>
            <th>PF</th><th>PA</th><th>Streak</th>
          </tr>
        </thead>
        <tbody id="standings-body"></tbody>
      </table>
    </section>

    <section id="tab-matchups" class="tab-panel">
      <div class="week-picker">
        <label>Week <input type="number" id="week" min="1" max="18"></label>
        <button id="week-load">Go</button>
      </div>
      <div id="matchups-list"></div>
    </section>

    <section id="tab-rosters" class="tab-panel">
      <select id="team-select"></select>
      <table>
        <thead>
          <tr>
            <th>Slot</th><th>Player</th><th>Pos</th><th>Team</th>
            <th>Status</th><th>Points</th><th>Proj</th>
          </tr>
        </thead>
        <tbody id="roster-body"></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
